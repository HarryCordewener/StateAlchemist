version: 2

# Pinned actions stop being a security measure the moment they stop being updated: Dependabot rewrites the digest
# and the version comment together, so a pin is current without anyone reading release notes for a living.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Roslyn's version is the floor the generator supports, not a dependency to chase. An analyzer compiled
    # against a newer Roslyn than the host compiler is refused with CS9057, so raising this drops every consumer
    # on an older SDK — it is a decision about what the package supports, not an update. Patches only.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis*"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    groups:
      roslyn:
        patterns: [ "Microsoft.CodeAnalysis*" ]
      rest:
        patterns: [ "*" ]
        exclude-patterns: [ "Microsoft.CodeAnalysis*" ]
