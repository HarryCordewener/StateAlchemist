name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Nothing here writes anything: least privilege for the token every job gets.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.framework }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [ net8.0, net10.0, net11.0 ]
        # Release as well as Debug: the allocation tests measure what the JIT and the async builders do, and that
        # differs between the two. Without this, a tag is the first time anything compiles Release.
        configuration: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # global.json pins the SDK that builds every target; 8.0.x and 10.0.x bring the test runtimes.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration ${{ matrix.configuration }}
      - run: dotnet test --solution StateAlchemist.slnx --no-build --configuration ${{ matrix.configuration }} --framework ${{ matrix.framework }}

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Spec §9: a machine in a native binary. The publish must warn about nothing — no reflection, no dictionaries,
      # nothing the trimmer has to guess at — and the binary must negotiate the same way the sample does.
      - run: dotnet publish samples/StateAlchemist.AotSample -c Release -r linux-x64 -warnaserror
      - run: samples/StateAlchemist.AotSample/bin/Release/net11.0/linux-x64/publish/StateAlchemist.AotSample

  package:
    runs-on: ubuntu-latest
    steps:
      # The tags, because MinVer reads the version from them: a shallow clone builds 0.0.0, and package validation
      # refuses an assembly version below the published baseline's.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Packs the library and uses the package: the generator and the analyzers must come with it and work in an
      # application that only references StateAlchemist. Nothing is published.
      - run: eng/check-package.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet mdsnippets
      - name: The docs match the compiled samples
        run: git diff --exit-code -- '*.md'
